<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEE - Tic Tac Toe</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #080808;
        color: #ddd;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .game {
        text-align: center;
    }

    h1 {
        margin-bottom: 8px;
        font-size: 28px;
        letter-spacing: 4px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    #board {
        width: 300px;
        height: 300px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border: 2px solid #555;
    }

    .cell {
        background: #111;
        border: 1px solid #444;
        color: #ddd;
        font-size: 55px;
        font-family: monospace;
        cursor: pointer;
    }

    .cell:hover {
        background: #1b1b1b;
    }

    #status {
        margin-top: 20px;
        min-height: 25px;
        color: #aaa;
    }

    button {
        margin-top: 18px;
        padding: 10px 20px;
        background: #111;
        color: #ddd;
        border: 1px solid #555;
        font-family: monospace;
        cursor: pointer;
    }

    button:hover {
        background: #222;
    }

    #winScreen {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
    }

    #winScreen h2 {
        font-size: 20px;
        letter-spacing: 3px;
    }

    #number8 {
        margin-top: 20px;
        font-size: 130px;
        color: white;
        text-shadow: 0 0 20px #fff;
    }

    .glitch {
        animation: glitch 0.15s infinite;
    }

    @keyframes glitch {
        0% {
            transform: translate(0);
        }
        25% {
            transform: translate(3px, -2px);
        }
        50% {
            transform: translate(-2px, 2px);
        }
        75% {
            transform: translate(2px, 1px);
        }
        100% {
            transform: translate(0);
        }
    }
</style>
</head>

<body>

<div class="game" id="game">
    <h1>HEE</h1>
    <div class="subtitle">EMPLOYEE TEST 03</div>

    <div id="board"></div>

    <div id="status">YOUR TURN</div>

    <button onclick="resetGame()">RESTART</button>
</div>

<div id="winScreen">
    <h2>EMPLOYEE TEST COMPLETE</h2>
    <div>ACCESS NUMBER:</div>
    <div id="number8" class="glitch">8</div>
</div>

<script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const winScreen = document.getElementById("winScreen");
    const gameElement = document.getElementById("game");

    let board = ["", "", "", "", "", "", "", ""];
    let gameOver = false;
    let playerTurn = true;

    const winningCombos = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
    ];

    function createBoard() {
        boardElement.innerHTML = "";

        for (let i = 0; i < 9; i++) {
            const cell = document.createElement("button");

            cell.className = "cell";
            cell.textContent = board[i];
            cell.onclick = () => playerMove(i);

            boardElement.appendChild(cell);
        }
    }

    function playerMove(index) {
        if (gameOver || !playerTurn || board[index] !== "") {
            return;
        }

        board[index] = "X";
        createBoard();

        if (checkWinner("X")) {
            winGame();
            return;
        }

        if (board.every(cell => cell !== "")) {
            statusElement.textContent = "DRAW";
            gameOver = true;
            return;
        }

        playerTurn = false;
        statusElement.textContent = "HEE IS THINKING...";

        setTimeout(computerMove, 400);
    }

    function computerMove() {
        if (gameOver) return;

        let move = findBestMove();

        if (move !== -1) {
            board[move] = "O";
        }

        createBoard();

        if (checkWinner("O")) {
            statusElement.textContent = "TEST FAILED";
            gameOver = true;
            return;
        }

        if (board.every(cell => cell !== "")) {
            statusElement.textContent = "DRAW";
            gameOver = true;
            return;
        }

        playerTurn = true;
        statusElement.textContent = "YOUR TURN";
    }

    function findBestMove() {
        // Try to win
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                board[i] = "O";

                if (checkWinner("O")) {
                    board[i] = "";
                    return i;
                }

                board[i] = "";
            }
        }

        // Block the player
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                board[i] = "X";

                if (checkWinner("X")) {
                    board[i] = "";
                    return i;
                }

                board[i] = "";
            }
        }

        // Take center
        if (board[4] === "") {
            return 4;
        }

        // Take a corner
        const corners = [0, 2, 6, 8];

        for (let corner of corners) {
            if (board[corner] === "") {
                return corner;
            }
        }

        // Take any remaining space
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                return i;
            }
        }

        return -1;
    }

    function checkWinner(symbol) {
        return winningCombos.some(combo => {
            return combo.every(index => board[index] === symbol);
        });
    }

    function winGame() {
        gameOver = true;
        statusElement.textContent = "TEST COMPLETE";

        setTimeout(() => {
            gameElement.style.display = "none";
            winScreen.style.display = "flex";
        }, 700);
    }

    function resetGame() {
        board = ["", "", "", "", "", "", "", ""];
        gameOver = false;
        playerTurn = true;

        winScreen.style.display = "none";
        gameElement.style.display = "block";

        statusElement.textContent = "YOUR TURN";

        createBoard();
    }

    createBoard();
</script>

</body>
  </html>
