<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEE - Test 03</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: white;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #game {
        text-align: center;
    }

    h1 {
        letter-spacing: 5px;
        margin-bottom: 5px;
    }

    #subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    #board {
        width: 300px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        margin: auto;
        border: 2px solid #555;
    }

    .cell {
        background: #0b0b0b;
        border: 1px solid #444;
        color: white;
        font-family: monospace;
        font-size: 55px;
        cursor: pointer;
    }

    .cell:hover {
        background: #171717;
    }

    #status {
        margin-top: 20px;
        min-height: 20px;
        color: #aaa;
    }

    #restart {
        margin-top: 15px;
        padding: 10px 20px;
        background: #111;
        border: 1px solid #555;
        color: white;
        font-family: monospace;
        cursor: pointer;
    }

    #winScreen {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    #winScreen h2 {
        letter-spacing: 4px;
    }

    #number8 {
        font-size: 150px;
        margin-top: 15px;
        text-shadow: 0 0 25px white;
        animation: glitch 0.15s infinite;
    }

    @keyframes glitch {
        0% {
            transform: translate(0);
        }

        25% {
            transform: translate(3px, -2px);
        }

        50% {
            transform: translate(-3px, 2px);
        }

        75% {
            transform: translate(2px, 1px);
        }

        100% {
            transform: translate(0);
        }
    }
</style>
</head>

<body>

<div id="game">

    <h1>HEE</h1>

    <div id="subtitle">
        EMPLOYEE TEST 03
    </div>

    <div id="board"></div>

    <div id="status">
        YOUR TURN
    </div>

    <button id="restart" onclick="restartGame()">
        RESTART
    </button>

</div>

<div id="winScreen">

    <h2>TEST COMPLETE</h2>

    <div>
        ACCESS NUMBER:
    </div>

    <div id="number8">
        8
    </div>

</div>

<script>

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const gameElement = document.getElementById("game");
const winScreen = document.getElementById("winScreen");

let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let gameOver = false;
let playerTurn = true;

const winningLines = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];

function drawBoard() {

    boardElement.innerHTML = "";

    for (let i = 0; i < 9; i++) {

        const cell = document.createElement("button");

        cell.className = "cell";

        cell.textContent = board[i];

        cell.onclick = function() {
            playerMove(i);
        };

        boardElement.appendChild(cell);
    }
}

function playerMove(index) {

    if (gameOver) return;

    if (!playerTurn) return;

    if (board[index] !== "") return;

    board[index] = "X";

    drawBoard();

    if (checkWinner("X")) {

        winGame();

        return;
    }

    if (isDraw()) {

        statusElement.textContent = "DRAW";

        gameOver = true;

        return;
    }

    playerTurn = false;

    statusElement.textContent = "HEE IS THINKING...";

    setTimeout(computerMove, 400);
}

function computerMove() {

    if (gameOver) return;

    let move = findComputerMove();

    if (move !== -1) {

        board[move] = "O";
    }

    drawBoard();

    if (checkWinner("O")) {

        statusElement.textContent = "TEST FAILED";

        gameOver = true;

        return;
    }

    if (isDraw()) {

        statusElement.textContent = "DRAW";

        gameOver = true;

        return;
    }

    playerTurn = true;

    statusElement.textContent = "YOUR TURN";
}

function findComputerMove() {

    // Try to win.

    for (let i = 0; i < 9; i++) {

        if (board[i] === "") {

            board[i] = "O";

            if (checkWinner("O")) {

                board[i] = "";

                return i;
            }

            board[i] = "";
        }
    }

    // Block the player.

    for (let i = 0; i < 9; i++) {

        if (board[i] === "") {

            board[i] = "X";

            if (checkWinner("X")) {

                board[i] = "";

                return i;
            }

            board[i] = "";
        }
    }

    // Take center.

    if (board[4] === "") {

        return 4;
    }

    // Take a corner.

    const corners = [
        0, 2, 6, 8
    ];

    for (let corner of corners) {

        if (board[corner] === "") {

            return corner;
        }
    }

    // Take any available square.

    for (let i = 0; i < 9; i++) {

        if (board[i] === "") {

            return i;
        }
    }

    return -1;
}

function checkWinner(symbol) {

    for (let line of winningLines) {

        const a = line[0];
        const b = line[1];
        const c = line[2];

        if (
            board[a] === symbol &&
            board[b] === symbol &&
            board[c] === symbol
        ) {

            return true;
        }
    }

    return false;
}

function isDraw() {

    return board.every(function(cell) {

        return cell !== "";

    });
}

function winGame() {

    gameOver = true;

    statusElement.textContent =
        "TEST COMPLETE";

    setTimeout(function() {

        gameElement.style.display = "none";

        winScreen.style.display = "flex";

    }, 700);
}

function restartGame() {

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    gameOver = false;

    playerTurn = true;

    statusElement.textContent =
        "YOUR TURN";

    gameElement.style.display = "block";

    winScreen.style.display = "none";

    drawBoard();
}

drawBoard();

</script>

</body>
</html>
